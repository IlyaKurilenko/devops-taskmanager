<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Менеджер задач DevOps(изменение текста страницы для тестирования системы)</h1>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Введите новую задачу...">
            <button onclick="addTask()">Разместить!</button>
        </div>
        <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
